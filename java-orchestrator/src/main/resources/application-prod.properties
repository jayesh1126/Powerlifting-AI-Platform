# Active when SPRING_PROFILES_ACTIVE=prod (set by the container).
#
# Secrets are NOT here — only placeholders that pull from environment variables
# supplied at runtime (compose env_file). This file is safe to commit and to
# bake into the image because it contains no values, and it lets the env var
# names stay clean and match the Python service's, rather than the awkward
# dash-removed forms Spring's relaxed binding would otherwise require
# (POWERLIFTING_INTERNALAPIKEY and friends).

powerlifting.internal-api-key=${INTERNAL_API_KEY}
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
powerlifting.supabase.url=${SUPABASE_URL}
powerlifting.supabase.secret-key=${SUPABASE_SECRET_KEY}

# Datasource credentials come straight from the standard SPRING_DATASOURCE_*
# environment variables (relaxed binding handles those cleanly), set on the
# compose service, so they are not repeated here.

# Content-free JSON logs in production would go here later (log format parity
# with the Python service is still outstanding — see PORT_PLAN.md).
