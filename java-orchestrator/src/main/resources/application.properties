spring.application.name=java-orchestrator

# Local runs get the dev profile automatically; deployments set
# SPRING_PROFILES_ACTIVE=prod and supply secrets as environment variables.
spring.profiles.default=dev

# --- Concurrency ------------------------------------------------------------
# One virtual thread per request. Blocking JDBC, blocking RestClient calls and
# blocking queue reads (the Reactor bridge in the generator) all park the
# virtual thread and release its carrier, so imperative straight-line code gets
# the concurrency profile of an async event loop. See PORT_PLAN.md 2.1.
spring.threads.virtual.enabled=true

# The gateway caps one runtime call at 180s (web/src/lib/orchestrator.ts).
# Match it: a stream we hold open longer than that is one nobody is reading.
spring.mvc.async.request-timeout=180000

# --- Wire contract ----------------------------------------------------------
# The gateway contract is snake_case throughout.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Never 400 on a field we don't know yet: the gateway must be able to add one
# before this service learns about it.
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Error responses --------------------------------------------------------
# NOTE the prefix: Boot 4 renamed `server.error.*` to `spring.web.error.*`; the
# old names bind to nothing and fail silently.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# --- Spring AI --------------------------------------------------------------
# Chat models go through OpenRouter, which is OpenAI-compatible.
spring.ai.openai.base-url=https://openrouter.ai/api/v1
# Client-level request timeout. The default is too short for a slow model doing
# a large non-streaming call (program normalization): its stream is reset
# mid-generation. Hold calls open to just under the gateway's 180s window so a
# slow-but-valid normalization completes; streaming calls (chat) keep bytes
# flowing and never approach this.
spring.ai.openai.chat.timeout=170s
# Only chat and embedding are used. The other capabilities each construct an
# HTTP client at startup for nothing.
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# --- Model roles ------------------------------------------------------------
# Quality vs. cost, tuned per stage in one place. All non-reasoning: reasoning
# models (GPT-5 nano, deepseek-*-pro) burn their token budget on hidden
# reasoning and return empty content for the small structured calls (planner,
# rewriter), and stream in one lump at the end for generation. Gemini Flash /
# Flash-Lite stream token-by-token and are the cost/performance optimum here.
# planner is also reused for the retrieval query-rewriter.
powerlifting.models.planner=google/gemini-3.5-flash-lite
powerlifting.models.generator=google/gemini-3.5-flash
powerlifting.models.summarizer=google/gemini-3.5-flash-lite
powerlifting.models.embedding=text-embedding-3-large
# Suggest (coaching judgment) uses flash; normalize is mechanical text->JSON
# transcription, so it uses the cheaper flash-lite — a normalize can emit
# thousands of output tokens for a multi-week program, and at flash prices that
# adds up fast. Splitting the roles keeps normalize cheap without dropping
# suggest quality.
powerlifting.models.program=google/gemini-3.5-flash
powerlifting.models.program-normalize=google/gemini-3.5-flash-lite
# A dense multi-week program is a large JSON document. The normalize prompt keeps
# output compact (it omits null/default fields), but headroom still matters: too
# low a ceiling truncates the JSON mid-document, which the normalizer detects and
# reports as "too large" rather than retrying a doomed generation.
powerlifting.models.program-max-tokens=20000

# Embeddings must match the model that embedded the knowledge base.
spring.ai.openai.embedding.options.model=${powerlifting.models.embedding}

# --- Runtime knobs ----------------------------------------------------------
powerlifting.runtime.max-tool-rounds=5
powerlifting.runtime.max-tool-result-chars=20000

# --- OpenPowerlifting database (read-only) ----------------------------------
# Connection URL + credentials come from the active profile (dev/prod); these
# are the pool settings, which are the same everywhere.
#
# Pool sizing for a single VPS: a small pool is deliberate. Most chat turns
# never touch this database, each query is tens of milliseconds, and Postgres
# performs worse with many competing connections than with a short queue. A
# request that finds all connections busy parks its virtual thread until one
# frees — the pool is back-pressure, not a thread-starvation risk.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=opl
spring.datasource.hikari.read-only=true
# Belt-and-suspenders with read-only above: even a bug in a query cannot write.
spring.datasource.hikari.connection-init-sql=SET default_transaction_read_only = on
# Fail a query fast when the database is unreachable, instead of tying up the
# request thread for the 30s Hikari default.
spring.datasource.hikari.connection-timeout=5000
# Do not fail startup if the database is momentarily down; connect lazily on
# first use and let it recover on its own.
spring.datasource.hikari.initialization-fail-timeout=-1

# --- API docs (springdoc / Swagger UI) --------------------------------------
# Spec at /v3/api-docs, UI at /swagger-ui.html. Both are exempt from the API-key
# filter (a browser cannot send the header); safe because the service is
# unpublished. Set springdoc.api-docs.enabled=false to turn it off in prod.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Observability ----------------------------------------------------------
# /actuator/health is the health endpoint; there is no hand-rolled controller.
# Only health (container check) and prometheus (scrape) are exposed — nothing
# else the internal network could read.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# The OpenPowerlifting database is a non-critical, degradable dependency: if it
# is down the lifter tools return an error the model handles gracefully, and
# chat/retrieval still work. So it must NOT gate the service's health — a DOWN
# from opl-db would otherwise fail the deploy check and flap the container even
# though the service is serving fine. opl-db has its own healthcheck in compose.
management.health.db.enabled=false

# --- Logging ----------------------------------------------------------------
# INFO and above must stay free of user content: queries, tool arguments and
# generated text are DEBUG only.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} [%X{requestId:--}] %msg%n
